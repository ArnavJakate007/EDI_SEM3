[project]
name = "sattsr"
version = "0.1.0"
description = "Cross-sensor temporal super resolution for geostationary thermal imagery"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "h5py>=3.10",
    "pyproj>=3.6",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "pillow>=10.2",
    "imageio>=2.34",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tqdm>=4.66",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
download = ["s3fs>=2024.2", "fsspec>=2024.2", "requests>=2.31"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.3", "httpx>=0.27"]

[project.scripts]
sattsr = "sattsr.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sattsr", "web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = ["slow: longer-running tests; run with -m slow"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
